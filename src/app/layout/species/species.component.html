<div class="find-plants-container">
    <div class="plants-container">
        <ng-container
            *ngFor="let plant of this.plantsStoreService.state(); index as i"
        >
            <div *ngIf="showItem(plant.id)">
                <app-plant
                    [plant]="plant"
                    (showDetails)="onShowDetails(plant)"
                    (onToggleFavorite)="onToggleFavorite($event)"
                    [isCollection]="isCollection()"
                >
                </app-plant>
            </div>
        </ng-container>
    </div>
    <app-plant-modal
        *ngIf="showModal"
        [plant]="selectedSpecies"
        [isCollectionItem]="isCollection()"
        (closeModal)="onCloseDetails()"
        (onItemsChanged)="reloadSpecies()"
        [initialCollectionSize]="collectionSize(selectedSpecies)"
        (onChangeCollectionSize)="onChangeCollectionSize($event)"
    >
    </app-plant-modal>
    <app-add-plant *ngIf="addingPlant" (close)="onCloseAddPlantView()">
    </app-add-plant>
    <div class="add-plant-btn-container">
        <button
            class="btn btn-primary add-plant-btn"
            (click)="onAddPlantClick()"
        >
            <span class="material-symbols-outlined"> add </span>
        </button>
    </div>
</div>
